version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: algo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: algo_workspace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d algo_workspace"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: algo_ml_service
    restart: unless-stopped
    environment:
      ML_PORT: 8000
      ML_HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/algo_workspace?schema=public
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo_backend_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/algo_workspace?schema=public
      JWT_SECRET: super-secret-jwt-access-token-key-32chars
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: super-secret-jwt-refresh-token-key-32chars
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
      STORAGE_PROVIDER: local
      UPLOAD_DIR: ./uploads
      ML_SERVICE_URL: http://ml-service:8000
      AI_FEATURES_ENABLED: "true"
      ANTHROPIC_API_KEY: ""
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
